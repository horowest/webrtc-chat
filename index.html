<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
     <link href="static/style.css" rel="stylesheet"/>
    <title>WebRTC Project</title>
</head>
<body>


    <div class="container text-left">
        <div id="app-name" class="row mb-5 mt-2">
            <h1>WebRTC Chat</h1>
        </div>
        <div class="row">
            <div class="col-4 user-form">
                <div class="input-group mb-3">
                    <span class="input-group-text" id="basic-addon1">@</span>
                    <input id="username" type="text" class="form-control" placeholder="Username" aria-label="Username" aria-describedby="basic-addon1">
                </div>                  
                <button id="connect-btn" class="btn btn-outline-primary">connect</button>
                <button id="disconnect-btn" class="btn btn-outline-secondary" disabled>disconnect</button>
                <br>
                <span id="conn-msg"></span>
            </div>
            <div class="col-5"></div>
            <div class="col-7 text-left mt-3 mb-5 msg-div">
                <div class="msg-box vstack gap-1" id="reply">
                </div>
            </div>
        </div>
        <div class="row">
            <div id="msg-div" class="col-12">
                <div class="input-group">
                    <span class="input-group-text">Message:</span>
                    <input type="text" class="form-control  msg-box" id="msg" aria-label="message" aria-describedby="basic-addon1" disabled>
                    <!--Msg: <input type="text" id="msg" class="msg-box" disabled>-->
                    <button id="send-btn" class="msg-box btn btn-outline-primary" disabled>Send</button>
                </div>
            </div>
        </div>
    </div>
</body>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous"></script>
<script src="static/main.js"></script>

</html>
